name: CI

# Mirrors `npm run verify`, split into parallel jobs. Everything runs against the local
# Firebase emulators (project demo-flack): no Google Cloud project or secrets are needed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes (Markdown, docs/, the website, templates) skip the checks below. Skipped
  # jobs count as passing for required checks, so those PRs can still merge.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!site/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'

  scripts:
    name: Shell scripts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning scripts/*.sh telemetry/*.sh

  build:
    name: Typecheck, unit tests and build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: node scripts/check-build.mjs

  rules:
    name: Security rules and functions
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:emu

  e2e:
    name: End to end (${{ matrix.name }})
    needs: changes
    # No job-level `if`: a skipped matrix job reports as "End to end (${{ matrix.name }})", never
    # under the names branch protection requires. For docs-only changes the steps skip instead.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium
            projects: --project=chromium
            browsers: chromium
          - name: WebKit and phones
            projects: --project=webkit --project=iphone --project=pixel
            browsers: chromium webkit
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: needs.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        if: needs.changes.outputs.code == 'true'
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
        if: needs.changes.outputs.code == 'true'
      - run: npm run build -w firebase/functions
        if: needs.changes.outputs.code == 'true'
      - name: Playwright
        if: needs.changes.outputs.code == 'true'
        run: scripts/fb.sh emulators:exec --project demo-flack --only auth,firestore,database,storage,functions,pubsub "cd e2e && npx playwright test ${{ matrix.projects }}"
      - name: Upload the Playwright report
        if: failure() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browsers == 'chromium' && 'chromium' || 'webkit-phones' }}
          path: e2e/artifacts
          retention-days: 7
